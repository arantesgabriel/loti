name: Loti - CI/CD

on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmo migrations e deploy em Production"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: loti-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar aplicação

    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Exigir confirmação explícita em Production
        if: github.ref_name == 'main' && github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          if [[ "$CONFIRM_PRODUCTION" != "true" ]]; then
            echo "::error::Production exige confirmação explícita."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar ESLint
        run: npm run lint

      - name: Executar testes unitários
        run: npm run test:unit

  deploy:
    name: Build, migrations e publicação
    needs: validate
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Garantir que a execução usa o HEAD da branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::A branch mudou desde o início da execução. Inicie um novo workflow."
            exit 1
          fi

      - name: Validar credenciais e banco Turso
        shell: bash
        run: |
          set -euo pipefail

          for key in TURSO_DATABASE_URL TURSO_AUTH_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key ausente"
              exit 1
            fi
          done

          node --input-type=module <<'NODE'
          const expected = process.env.GITHUB_REF_NAME === "main" ? "loti-prod" : "loti-dev";
          let parsed;
          try {
            parsed = new URL(process.env.TURSO_DATABASE_URL);
          } catch {
            console.error("URL Turso inválida.");
            process.exit(1);
          }
          if (parsed.protocol !== "libsql:" ||
              !parsed.hostname.startsWith(`${expected}-`) ||
              !parsed.hostname.endsWith(".turso.io")) {
            console.error(`Destino Turso incompatível com ${process.env.GITHUB_REF_NAME}.`);
            process.exit(1);
          }
          console.log(`Destino Turso ${expected} validado.`);
          NODE

      - name: Instalar Vercel CLI
        run: npm install --global vercel@65.0.0

      - name: Vincular ambiente Vercel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            vercel pull \
              --yes \
              --environment=production \
              --token="$VERCEL_TOKEN"
          else
            vercel pull \
              --yes \
              --environment=preview \
              --git-branch=dev \
              --token="$VERCEL_TOKEN"
          fi

      - name: Criar deployment sem atualizar os domínios
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            URL=$(vercel deploy \
              --prod \
              --skip-domain \
              --yes \
              --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy \
              --yes \
              --token="$VERCEL_TOKEN")
          fi

          if [[ "$URL" != https://*.vercel.app ]]; then
            echo "::error::URL de deployment inesperada"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Build remoto concluído: $URL"
          echo "### Deployment preparado: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Validar deployment da Vercel antes das migrations
        id: inspected
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.staged.outputs.url }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_URL#https://}"

          DATA=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$HOST?teamId=$VERCEL_ORG_ID")

          EXPECTED_TARGET="preview"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            EXPECTED_TARGET="production"
          fi

          DEPLOYMENT_ID=$(jq -r \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg target "$EXPECTED_TARGET" \
            'if .projectId == $project and .readyState == "READY" and
                ($target != "production" or .target == "production") and
                ($target != "preview" or .target != "production")
             then (.id // .uid // empty) else empty end' <<< "$DATA")

          if [[ -z "$DEPLOYMENT_ID" ]]; then
            echo "::error::Deployment não está READY, tem ambiente incorreto ou pertence a outro projeto."
            exit 1
          fi
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Executar migrations
        run: npm run db:migrate

      - name: Verificar integridade do banco
        run: npm run db:verify

      - name: Garantir branch atual antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::A branch mudou durante a execução. Deployment preparado, mas não publicado."
            exit 1
          fi

      - name: Publicar Preview via API Vercel
        if: github.ref_name == 'dev'
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.inspected.outputs.id }}
          DEPLOY_URL: ${{ steps.staged.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"alias":"dev.useloti.com"}' \
            -o /dev/null

          {
            echo "### Preview publicado"
            echo "Domínio: https://dev.useloti.com"
            echo "Deployment: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promover Production via API Vercel
        if: github.ref_name == 'main'
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.inspected.outputs.id }}
          DEPLOY_URL: ${{ steps.staged.outputs.url }}
        run: |
          set -euo pipefail
          echo "Solicitando promoção do deployment Production..."

          curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' \
            -o /dev/null

          {
            echo "### Promoção Production solicitada"
            echo "Domínio previsto: https://useloti.com"
            echo "Deployment: $DEPLOY_URL"
            echo "Confira a conclusão da promoção no dashboard Vercel."
          } >> "$GITHUB_STEP_SUMMARY"
