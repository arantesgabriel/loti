
name: Loti - CI/CD

on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loti-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. VALIDAR APLICAÇÃO
  # ==========================================

  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar ESLint
        run: npm run lint

      - name: Executar testes unitários
        run: npm run test:unit

  # ==========================================
  # 2. BUILD, MIGRATIONS E PUBLICAÇÃO
  # ==========================================

  deploy:
    name: Build, Migrations e Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}

    steps:
      # ========================================
      # PREPARAÇÃO
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # ========================================
      # VALIDAR CREDENCIAIS
      # ========================================

      - name: Validar configurações
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            TURSO_DATABASE_URL \
            TURSO_AUTH_TOKEN \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key não configurado"
              exit 1
            fi
          done

          echo "Credenciais presentes."

      # ========================================
      # VALIDAR BANCO DE DESTINO
      # ========================================

      - name: Validar banco Turso
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.TURSO_DATABASE_URL;
          const token = process.env.TURSO_AUTH_TOKEN;
          const branch = process.env.GITHUB_REF_NAME;

          const expectedDatabase =
            branch === "main"
              ? "loti-prod"
              : "loti-dev";

          if (!url || !token) {
            console.error(
              "Credenciais Turso ausentes."
            );
            process.exit(1);
          }

          let hostname;

          try {
            const parsed = new URL(url);

            if (parsed.protocol !== "libsql:") {
              throw new Error("Protocolo inválido");
            }

            hostname = parsed.hostname;
          } catch {
            console.error("URL Turso inválida.");
            process.exit(1);
          }

          if (
            !hostname.startsWith(
              `${expectedDatabase}-`
            ) ||
            !hostname.endsWith(".turso.io")
          ) {
            console.error(
              `Banco incompatível com a branch ${branch}.`
            );
            process.exit(1);
          }

          console.log(
            `Destino ${expectedDatabase} validado.`
          );
          NODE

      # ========================================
      # PREPARAR VERCEL
      # ========================================

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vincular ambiente Vercel
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Carregando Production..."

            vercel pull \
              --yes \
              --environment=production \
              --token="$VERCEL_TOKEN"
          else
            echo "Carregando Preview (dev)..."

            vercel pull \
              --yes \
              --environment=preview \
              --git-branch=dev \
              --token="$VERCEL_TOKEN"
          fi

      # ========================================
      # BUILD REMOTO ANTES DAS MIGRATIONS
      # ========================================

      - name: Criar deployment sem publicar
        id: staged
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Preparando build de produção..."

            URL=$(vercel deploy \
              --prod \
              --skip-domain \
              --yes \
              --token="$VERCEL_TOKEN")
          else
            echo "Preparando build Preview..."

            URL=$(vercel deploy \
              --yes \
              --token="$VERCEL_TOKEN")
          fi

          if [[ ! "$URL" == https://* ]]; then
            echo "::error::Deployment URL inválida"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Build remoto concluído."
          echo "Deployment: $URL"

          echo "### Build preparado" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "URL: $URL" \
            >> "$GITHUB_STEP_SUMMARY"

      # ========================================
      # EXECUTAR MIGRATIONS
      # ========================================

      - name: Executar migrations
        shell: bash
        run: |
          set -euo pipefail

          echo "Executando migrations..."

          npm run db:migrate

          echo "Migrations concluídas."

      # ========================================
      # VERIFICAR INTEGRIDADE
      # ========================================

      - name: Verificar integridade do banco
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando integridade..."

          npm run db:verify

          echo "Banco validado."

      # ========================================
      # PUBLICAR VERSÃO APROVADA
      # ========================================

      - name: Publicar deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.staged.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Deployment não encontrado"
            exit 1
          fi

          if [ -z "${VERCEL_TEAM_SLUG:-}" ]; then
            echo "::error::VERCEL_TEAM_SLUG não configurado"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Promovendo para produção..."

            vercel promote \
              "$DEPLOY_URL" \
              --yes \
              --scope="$VERCEL_TEAM_SLUG" \
              --token="$VERCEL_TOKEN"

            DOMAIN="useloti.com"
          else
            echo "Atualizando Preview..."

            vercel alias set \
              "$DEPLOY_URL" \
              dev.useloti.com \
              --scope="$VERCEL_TEAM_SLUG" \
              --token="$VERCEL_TOKEN"

            DOMAIN="dev.useloti.com"
          fi

          echo "Publicação concluída: $DOMAIN"

          {
            echo "### Deploy concluído"
            echo ""
            echo "Branch: $GITHUB_REF_NAME"
            echo ""
            echo "Domínio: https://$DOMAIN"
            echo ""
            echo "Deployment: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
